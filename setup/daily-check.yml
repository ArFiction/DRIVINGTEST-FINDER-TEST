name: DVSA availability check

on:
  schedule:
    # Three checks a day, each landing at a random time inside its window:
    #   ~6am UK      (05:35 + 0-45 min jitter)
    #   ~lunch peak  (11:20 + 0-45 min jitter)
    #   ~evening peak (17:20 + 0-45 min jitter)
    # GitHub cron is UTC only, so each window is scheduled at both possible
    # UK offsets and the guard step keeps whichever firing matches UK time.
    - cron: '35 4 * * *'
    - cron: '35 5 * * *'
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'
    - cron: '20 16 * * *'
    - cron: '20 17 * * *'
  workflow_dispatch: {} # manual runs for testing

permissions:
  contents: read

concurrency:
  group: dvsa-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Keep only the cron firing that matches its UK-time window
        id: guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/London date +%H)
          case "$HOUR" in
            05|11|17) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "UK local hour is $HOUR - this is the duplicate DST firing; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Random delay so each check lands at a random time in its window
        if: steps.guard.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 2700)) # 0-45 minutes
          echo "Sleeping ${DELAY}s (~$((DELAY / 60)) min)"
          sleep "$DELAY"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20

      - name: Restore Chrome profile from previous runs
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .chrome-profile
          key: chrome-profile-${{ github.run_id }}
          restore-keys: chrome-profile-

      - name: Install dependencies and real Chrome
        if: steps.guard.outputs.run == 'true'
        run: |
          npm install
          npx playwright install --with-deps chrome

      - name: Check for available tests (headed Chrome in virtual display)
        if: steps.guard.outputs.run == 'true'
        env:
          HEADLESS: 'false'
          DVSA_LICENCE_NUMBER: ${{ secrets.DVSA_LICENCE_NUMBER }}
          DVSA_THEORY_NUMBER: ${{ secrets.DVSA_THEORY_NUMBER }}
          DVSA_TEST_CENTRE: ${{ vars.DVSA_TEST_CENTRE }}
          DVSA_CENTRE_MATCH: ${{ vars.DVSA_CENTRE_MATCH }}
          DVSA_TEST_TYPE: ${{ vars.DVSA_TEST_TYPE }}
          DVSA_EARLIEST_DATE: ${{ vars.DVSA_EARLIEST_DATE }}
          DVSA_LATEST_DATE: ${{ vars.DVSA_LATEST_DATE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: xvfb-run --auto-servernum npm run check

      - name: Upload debug artifacts
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dvsa-check-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 5
